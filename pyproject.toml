[project]
name = "tcm-pulse-diagnosis"
version = "0.1.0"
description = "Apple Watch + AI-powered Traditional Chinese Medicine pulse diagnosis system"
requires-python = ">=3.10"
dependencies = [
    "neurokit2>=0.2.7",
    "scipy>=1.11.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "faster-whisper>=1.0.0",
    "faiss-cpu>=1.7.4",
    "yt-dlp>=2024.1.0",
    "anthropic>=0.40.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
